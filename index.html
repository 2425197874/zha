<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="投递记录">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#6366f1">
<title>投递记录</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --text:#1a1a2e; --sub:#6b7280;
    --line:#e8eaf0; --primary:#6366f1;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    padding-bottom:calc(32px + var(--safe-b));
    min-height:100vh;min-height:100dvh;
    touch-action:manipulation;
    overscroll-behavior-y:contain;
  }
  header{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;padding:22px 20px 24px;border-radius:0 0 26px 26px;
  }
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px}
  header .sub{margin:6px 0 18px;font-size:13px;opacity:.82}
  .stats{display:flex;gap:10px}
  .stats > div{
    flex:1;background:rgba(255,255,255,.16);border-radius:14px;
    padding:10px 8px;text-align:center;backdrop-filter:blur(4px);
  }
  .stats b{display:block;font-size:20px;font-weight:700;line-height:1.2}
  .stats span{font-size:11px;opacity:.85}

  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(20,20,60,.06)}

  input,select{
    font-family:inherit;font-size:16px;color:inherit;width:100%;
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;
    background:#fafbff;outline:none;transition:.15s;
  }
  input:focus,select:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
  .form .row{display:flex;gap:10px;margin-top:10px}
  .form .row > *{flex:1;min-width:0}
  #addBtn{
    margin-top:12px;width:100%;padding:13px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    font-size:16px;font-weight:600;font-family:inherit;
    transition:.15s;user-select:none;
  }
  #addBtn:active{transform:scale(.98);opacity:.9}

  #search{margin-top:14px}
  .filters{
    display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 15px;border-radius:999px;background:#fff;
    border:1px solid var(--line);font-size:13px;color:var(--sub);
    font-family:inherit;transition:.15s;user-select:none;
  }
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

  #list{margin-top:12px}
  .item{
    background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;
    box-shadow:0 2px 10px rgba(20,20,60,.06);
    animation:in .22s ease;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .company{font-size:16px;font-weight:600;line-height:1.35;word-break:break-all}
  .meta{font-size:12.5px;color:var(--sub);margin-top:5px}
  .del{
    background:none;border:none;color:#c8ccd6;font-size:18px;
    padding:2px 6px;line-height:1;font-family:inherit;flex:0 0 auto;user-select:none;
  }
  .del:active{color:#ef4444}
  select.status{
    margin-top:12px;font-size:16px;font-weight:600;padding:9px 10px;
    border-radius:10px;width:auto;min-width:140px;cursor:pointer;
    -webkit-appearance:menulist;appearance:menulist;
  }

  .empty{text-align:center;color:#9aa0b0;font-size:14px;padding:56px 0;line-height:1.6}
  .empty .big{font-size:36px;margin-bottom:12px}

  .foot{text-align:center;padding:16px 0 4px}
  .foot button{
    background:none;border:none;color:#9aa0b0;font-size:13px;
    font-family:inherit;text-decoration:underline;padding:10px;user-select:none;
  }

  #toast{
    position:fixed;left:50%;bottom:calc(34px + var(--safe-b));
    transform:translate(-50%,16px);
    background:rgba(30,30,50,.92);color:#fff;padding:10px 20px;border-radius:999px;
    font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;
    z-index:60;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  #a2hs{
    position:fixed;left:12px;right:12px;
    bottom:calc(12px + var(--safe-b));
    background:#1e1e32;color:#fff;border-radius:14px;
    padding:12px 14px;display:none;align-items:center;gap:10px;
    font-size:13px;line-height:1.45;
    box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:55;
  }
  #a2hs.show{display:flex}
  #a2hs .txt{flex:1}
  #a2hs .ico{font-size:20px;line-height:1}
  #a2hs button{
    background:rgba(255,255,255,.14);border:none;color:#fff;
    font-family:inherit;font-size:13px;font-weight:600;
    padding:7px 12px;border-radius:9px;flex:0 0 auto;user-select:none;
  }
</style>
</head>
<body>

<header>
  <h1>📮 投递记录</h1>
  <p class="sub">记录每一次简历投递</p>
  <div class="stats">
    <div><b id="statTotal">0</b><span>总投递</span></div>
    <div><b id="statActive">0</b><span>进行中</span></div>
    <div><b id="statOffer">0</b><span>Offer</span></div>
  </div>
</header>

<main>
  <section class="card form">
    <input id="company" placeholder="公司名称，如：字节跳动"
           autocomplete="off" autocapitalize="off" enterkeyhint="next">
    <div class="row">
      <input id="location" placeholder="工作地点，如：北京"
             autocomplete="off" autocapitalize="off" enterkeyhint="done">
      <select id="status"></select>
    </div>
    <button id="addBtn" type="button">+ 添加投递记录</button>
  </section>

  <input id="search" placeholder="🔍 搜索公司或地点"
         autocomplete="off" autocapitalize="off" enterkeyhint="search">
  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <div class="foot"><button id="exportBtn" type="button">导出数据（CSV）</button></div>
</main>

<div id="toast"></div>

<div id="a2hs">
  <span class="ico">📲</span>
  <span class="txt" id="a2hsTxt"></span>
  <button id="a2hsBtn" type="button">安装</button>
  <button id="a2hsClose" type="button" style="background:none;padding:7px 6px;font-size:16px">✕</button>
</div>

<script>
(function(){
  'use strict';

  var KEY = 'resume-tracker-v1';
  var A2HS_KEY = 'resume-tracker-a2hs-closed';

  var STATUSES = [
    {key:'applied',   label:'已投递',   color:'#3b82f6'},
    {key:'viewed',    label:'已查看',   color:'#8b5cf6'},
    {key:'written',   label:'笔试/测评', color:'#f59e0b'},
    {key:'interview', label:'面试中',   color:'#0ea5e9'},
    {key:'offer',     label:'已 Offer', color:'#10b981'},
    {key:'rejected',  label:'已结束',   color:'#ef4444'}
  ];
  var STATUS_MAP = {};
  STATUSES.forEach(function(s){ STATUS_MAP[s.key] = s; });
  var ACTIVE = ['applied','viewed','written','interview'];

  var $ = function(id){ return document.getElementById(id); };

  var records = load();
  var filter = 'all';

  /* ---------- 数据 ---------- */
  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch(e){ return []; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(records)); }
    catch(e){ toast('保存失败，请检查浏览器设置'); }
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtDate(ts){
    var d = new Date(ts);
    return (d.getMonth()+1) + '月' + d.getDate() + '日';
  }
  var toastTimer;
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  /* ---------- 应用图标 & PWA Manifest ---------- */
  function makeIcon(size){
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var r = size * 0.22;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.arcTo(size, 0, size, size, r);
    ctx.arcTo(size, size, 0, size, r);
    ctx.arcTo(0, size, 0, 0, r);
    ctx.arcTo(0, 0, size, 0, r);
    ctx.closePath();
    var g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#6366f1');
    g.addColorStop(1, '#a855f7');
    ctx.fillStyle = g;
    ctx.fill();

    var w = size * 0.50, h = size * 0.34;
    var x = (size - w) / 2, y = (size - h) / 2 + size * 0.02;
    var rr = size * 0.035;
    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + w * 0.12, y + h * 0.16);
    ctx.lineTo(x + w * 0.50, y + h * 0.64);
    ctx.lineTo(x + w * 0.88, y + h * 0.16);
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = size * 0.045;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    return c.toDataURL('image/png');
  }

  function setupAppShell(){
    try {
      var icon192 = makeIcon(192);
      var icon512 = makeIcon(512);

      var apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = icon192;
      document.head.appendChild(apple);

      var fav = document.createElement('link');
      fav.rel = 'icon';
      fav.href = icon192;
      document.head.appendChild(fav);

      var manifest = {
        name: '投递记录',
        short_name: '投递记录',
        description: '记录简历投递的公司、地点与状态',
        start_url: '.',
        scope: '.',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#f5f6fa',
        theme_color: '#6366f1',
        icons: [
          {src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any'},
          {src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any'}
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    } catch(e){ /* 某些环境不支持，忽略 */ }
  }
  setupAppShell();

  /* ---------- 添加到主屏幕引导 ---------- */
  var deferredPrompt = null;

  function isStandalone(){
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }
  function isIOS(){
    return /iP(hone|ad|od)/.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function isSafari(){
    var ua = navigator.userAgent;
    return /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/.test(ua);
  }
  function a2hsClosed(){
    try { return localStorage.getItem(A2HS_KEY) === '1'; } catch(e){ return false; }
  }

  function showA2HS(mode){
    if(isStandalone() || a2hsClosed()) return;
    var bar = $('a2hs');
    if(mode === 'ios'){
      $('a2hsTxt').textContent = '点底部「分享」→「添加到主屏幕」，即可像 App 一样全屏使用';
      $('a2hsBtn').style.display = 'none';
    } else {
      $('a2hsTxt').textContent = '把「投递记录」安装到桌面，随时快速记录';
      $('a2hsBtn').style.display = '';
    }
    bar.classList.add('show');
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    showA2HS('android');
  });

  $('a2hsBtn').addEventListener('click', function(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){
        deferredPrompt = null;
        $('a2hs').classList.remove('show');
      });
    }
  });
  $('a2hsClose').addEventListener('click', function(){
    $('a2hs').classList.remove('show');
    try { localStorage.setItem(A2HS_KEY, '1'); } catch(e){}
  });

  if(isIOS() && isSafari() && !isStandalone() && !a2hsClosed()){
    setTimeout(function(){ showA2HS('ios'); }, 1200);
  }

  /* ---------- 状态下拉 ---------- */
  (function initStatusSelect(){
    var sel = $('status');
    STATUSES.forEach(function(s){
      var o = document.createElement('option');
      o.value = s.key;
      o.textContent = s.label;
      sel.appendChild(o);
    });
  })();

  /* ---------- 筛选 ---------- */
  function buildChips(){
    var box = $('filters');
    var sl = box.scrollLeft;
    var html = '<button class="chip' + (filter === 'all' ? ' active' : '') +
               '" data-filter="all" type="button">全部</button>';
    STATUSES.forEach(function(s){
      html += '<button class="chip' + (filter === s.key ? ' active' : '') +
              '" data-filter="' + s.key + '" type="button">' + s.label + '</button>';
    });
    box.innerHTML = html;
    box.scrollLeft = sl;
  }
  $('filters').addEventListener('click', function(e){
    var btn = e.target.closest('[data-filter]');
    if(!btn) return;
    filter = btn.dataset.filter;
    render();
  });

  /* ---------- 添加 ---------- */
  function addRecord(){
    var company = $('company').value.trim();
    var location = $('location').value.trim();
    var status = $('status').value;

    if(!company){
      toast('请先填写公司名称');
      $('company').focus();
      return;
    }
    records.push({
      id: String(Date.now()) + Math.floor(Math.random() * 1000),
      company: company,
      location: location || '未填写',
      status: status,
      createdAt: Date.now()
    });
    save();
    $('company').value = '';
    $('location').value = '';
    $('status').value = 'applied';
    filter = 'all';
    render();
    toast('已添加');
    if(window.matchMedia('(hover:hover)').matches) $('company').focus();
  }
  $('addBtn').addEventListener('click', addRecord);
  $('company').addEventListener('keydown', function(e){ if(e.key === 'Enter') addRecord(); });
  $('location').addEventListener('keydown', function(e){ if(e.key === 'Enter') addRecord(); });

  /* ---------- 搜索 ---------- */
  $('search').addEventListener('input', render);

  /* ---------- 列表交互 ---------- */
  $('list').addEventListener('change', function(e){
    var sel = e.target.closest('select.status');
    if(!sel) return;
    var rec = records.find(function(r){ return r.id === sel.dataset.id; });
    if(rec){
      rec.status = sel.value;
      save();
      render();
    }
  });
  $('list').addEventListener('click', function(e){
    var btn = e.target.closest('[data-del]');
    if(!btn) return;
    var id = btn.dataset.del;
    var rec = records.find(function(r){ return r.id === id; });
    if(!rec) return;
    if(confirm('删除「' + rec.company + '」这条记录？')){
      records = records.filter(function(r){ return r.id !== id; });
      save();
      render();
      toast('已删除');
    }
  });

  /* ---------- 导出 CSV ---------- */
  $('exportBtn').addEventListener('click', function(){
    if(!records.length) return toast('还没有记录可导出');
    var rows = [['公司', '工作地点', '投递状态', '投递时间']];
    records.forEach(function(r){
      rows.push([
        r.company,
        r.location,
        (STATUS_MAP[r.status] || {label: r.status}).label,
        new Date(r.createdAt).toLocaleString('zh-CN')
      ]);
    });
    var csv = '\ufeff' + rows.map(function(row){
      return row.map(function(c){
        return '"' + String(c).replace(/"/g, '""') + '"';
      }).join(',');
    }).join('\r\n');

    var blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '投递记录_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    toast('已导出');
  });

  /* ---------- 渲染 ---------- */
  function render(){
    var total = records.length;
    var offer = records.filter(function(r){ return r.status === 'offer'; }).length;
    var active = records.filter(function(r){ return ACTIVE.indexOf(r.status) > -1; }).length;
    $('statTotal').textContent = total;
    $('statActive').textContent = active;
    $('statOffer').textContent = offer;

    buildChips();

    var kw = $('search').value.trim().toLowerCase();
    var list = records.slice()
      .sort(function(a, b){ return b.createdAt - a.createdAt; })
      .filter(function(r){ return filter === 'all' || r.status === filter; })
      .filter(function(r){
        return !kw || (r.company + ' ' + r.location).toLowerCase().indexOf(kw) > -1;
      });

    if(!list.length){
      $('list').innerHTML =
        '<div class="empty"><div class="big">🗂️</div>' +
        (records.length ? '没有符合条件的记录' : '还没有记录，先添加一条吧') +
        '</div>';
      return;
    }

    $('list').innerHTML = list.map(function(r){
      var st = STATUS_MAP[r.status] || {label: r.status, color: '#6b7280'};
      var opts = STATUSES.map(function(s){
        return '<option value="' + s.key + '"' +
               (s.key === r.status ? ' selected' : '') + '>' + s.label + '</option>';
      }).join('');
      return '' +
        '<div class="item">' +
          '<div class="item-top">' +
            '<div>' +
              '<div class="company">' + esc(r.company) + '</div>' +
              '<div class="meta">📍 ' + esc(r.location) + ' · ' + fmtDate(r.createdAt) + '</div>' +
            '</div>' +
            '<button class="del" data-del="' + r.id + '" type="button" aria-label="删除">✕</button>' +
          '</div>' +
          '<select class="status" data-id="' + r.id + '"' +
            ' style="color:' + st.color + ';background:' + st.color + '1a;border-color:' + st.color + '40">' +
            opts +
          '</select>' +
        '</div>';
    }).join('');
  }

  render();
})();
</script>
</body>
</html>
